<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CMD终端</title>
<style>
body{
  background:#000000;
  color:#33ff33;
  font-family: Consolas,"Courier New",monospace;
  padding:25px;
  font-size:19px;
  margin:0;
}
@keyframes blink {
  0% {opacity:1;}
  50% {opacity:0;}
  100% {opacity:1;}
}
.cursor{
  animation: blink 0.8s infinite;
}
</style>
</head>
<body>
<span id="typeText"></span><span class="cursor">_</span>
<script>
let content = "不努力和咸鱼有什么区别？";
let pos = 0;
let box = document.getElementById("typeText");
function typing(){
  if(pos < content.length){
    box.textContent += content[pos];
    pos++;
    setTimeout(typing,130);
  }
}
setTimeout(typing,700);
</script>
</body>
</html>
